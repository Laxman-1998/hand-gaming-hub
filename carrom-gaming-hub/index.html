<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Carrom Hub Prototype</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <h1>GESTURE CARROM ARENA</h1>
    <p>Prototype Simulation Matrix • Wave Hand to Slide Striker</p>

    <video id="webcam" autoplay playsinline style="display:none;"></video>
    <div id="lobby-mirror-canvas" style="display:none;"></div>

    <div id="canvas-container" style="display: flex; justify-content: center; align-items: center; position: relative;">
        <div id="lobby-loader" style="position: absolute; background: rgba(9,12,21,0.9); padding: 10px 20px; border-radius: 30px; color: #0ea5e9; font-weight: 700; border: 1px solid #0ea5e9; z-index: 10;">Warming AI Camera Array...</div>
        <canvas id="carromBoard" width="500" height="500" style="z-index: 1;"></canvas>
    </div>

    <div class="hud-panel">
        <div class="hud-stat">AIM STRATEGY: <span id="aim-label" style="color: #0ea5e9;">0°</span></div>
        <div class="hud-stat">STRIKE IMPULSE: <span id="power-label">LEVEL 0</span></div>
    </div>

    <a href="../index.html" class="back-btn">← BACK TO LOBBY HUB</a>

    <script src="app.js"></script>
</body>
</html>
